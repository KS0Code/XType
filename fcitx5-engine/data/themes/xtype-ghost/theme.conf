# XType ghost theme. Fcitx5's input panel as bare gray text on a
# transparent background, so XType's popup ghost style reads as ghost text.
# Applies to every Fcitx5 popup while selected (Theme=xtype-ghost in
# ~/.config/fcitx5/conf/classicui.conf).
[Metadata]
Name=XType Ghost
Version=1
Author=XType
Description=Gray ghost text on a transparent background (XType popup suggestions)
ScaleWithDPI=True

[InputPanel]
NormalColor=#8c8c8c
HighlightCandidateColor=#8c8c8c
HighlightColor=#8c8c8c
HighlightBackgroundColor=#00000000
EnableBlur=False

[InputPanel/TextMargin]
Left=0
Right=0
Top=0
Bottom=0

[InputPanel/ContentMargin]
Left=0
Right=0
Top=0
Bottom=0

[InputPanel/Background]
Color=#00000000
BorderColor=#00000000
BorderWidth=0

[InputPanel/Background/Margin]
Left=0
Right=0
Top=0
Bottom=0

[InputPanel/Highlight]
Color=#00000000

[InputPanel/Highlight/Margin]
Left=0
Right=0
Top=0
Bottom=0

[Menu/Background]
Color=#202020
BorderColor=#404040
BorderWidth=1

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
Color=#404040

[Menu/Highlight/Margin]
Left=5
Right=5
Top=5
Bottom=5

[Menu/Separator]
Color=#404040

[Menu/TextMargin]
Left=5
Right=5
Top=5
Bottom=5
